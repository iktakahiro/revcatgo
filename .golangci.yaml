version: "2"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/iktakahiro/revcatgo
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/iktakahiro/revcatgo

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - modernize
    - revive
    - testifylint
  settings:
    govet:
      enable:
        - nilfunc
        - nilness
